version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: wonderland-postgres
    environment:
      POSTGRES_DB: wonderland
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wonderland-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wonderland-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wonderland-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: wonderland-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - wonderland-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  wonderland-network:
    driver: bridge

